<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول — لوحة الإدارة</title>
  <link rel="icon" href="/assets/logo.png">
  <style>
    :root {
      --bg: #0b0f17;
      --card: #151d2a;
      --border: #233147;
      --accent: #bcf578;
      --accent-hover: #a5de62;
      --text: #f0f4fc;
      --muted: #8b9bb4;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Cairo", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 1.25rem;
      border-radius: 12px;
      object-fit: contain;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p.sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      text-align: right;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    input {
      background: #0d131e;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--accent);
    }
    button[type="submit"] {
      background: var(--accent);
      color: #060a10;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background-color 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover {
      background: var(--accent-hover);
    }
    button[type="submit"]:active {
      transform: scale(0.99);
    }
    .error-msg {
      background: rgba(255, 107, 107, 0.12);
      border: 1px solid var(--danger);
      color: var(--danger);
      border-radius: 8px;
      padding: 0.75rem;
      font-size: 0.85rem;
      display: none;
      text-align: center;
    }
    .back {
      display: inline-block;
      margin-top: 1.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
    }
    .back:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/assets/logo.png" alt="Logo" class="logo">
    <h1>لوحة التحكم</h1>
    <p class="sub">تسجيل الدخول لإدارة بورتفوليو معتز إمام</p>

    <div id="errMsg" class="error-msg"></div>

    <form id="loginForm">
      <label>
        اسم المستخدم أو البريد
        <input type="text" id="username" dir="ltr" placeholder="admin أو البريد" required autofocus>
      </label>
      <label>
        كلمة المرور
        <input type="password" id="password" dir="ltr" placeholder="••••••••" required>
      </label>
      <button type="submit" id="submitBtn">تسجيل الدخول</button>
    </form>

    <a href="/" class="back">← الرجوع للموقع</a>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const errMsg = document.getElementById('errMsg');
    const submitBtn = document.getElementById('submitBtn');

    form.onsubmit = async (e) => {
      e.preventDefault();
      errMsg.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'جاري التحقق…';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'فشل تسجيل الدخول');
        }
        window.location.href = '/admin-ui.html';
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'تسجيل الدخول';
      }
    };
  </script>
</body>
</html>
